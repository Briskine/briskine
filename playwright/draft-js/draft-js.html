<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Draft-js</title>
    <script src="/extension-ready.js"></script>
  </head>
  <body>
    <div id="editor"></div>

    <script type="module">
      import {React, createRoot, DraftJS} from '/vendor/draft-js.js'
      const {Editor, EditorState} = DraftJS

      class MyEditor extends React.Component {
        constructor () {
          super()
          this.state = {editorState: EditorState.createEmpty()}
          this.onChange = (editorState) => {
            try {
              this.setState({editorState})
            } catch (err) {
              console.log(err)
            }
          }
        }
        render() {
          return React.createElement(Editor, {
            editorState: this.state.editorState,
            onChange: this.onChange,
          })
        }
      }

      const root = createRoot(document.getElementById('editor'))
      root.render(React.createElement(MyEditor))
    </script>
  </body>
</html>
