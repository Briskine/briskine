<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Slate</title>
    <script src="/extension-ready.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      import {useMemo, createElement, createRoot, createEditor, Slate, Editable, withReact} from '/vendor/slate.js'

      const initialValue = [
        {
          type: 'paragraph',
          children: [
            { text: '' },
          ],
        },
      ]

      function Editor ({}) {
        const editor = useMemo(() => withReact(createEditor()), [])
        return createElement(Slate, {
          editor: editor,
          initialValue: initialValue,
        }, createElement(Editable))
      }

      const container = document.getElementById('editor')
      const root = createRoot(container)
      root.render(createElement(Editor))
    </script>
  </body>
</html>
