<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quill</title>
    <link href="/vendor/quill2.snow.css" rel="stylesheet">
    <script src="/extension-ready.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      import Quill from '/vendor/quill2.js'

      const quill = new Quill('#editor', {
        theme: 'snow'
      })
      quill.root.setAttribute('role', 'textbox')
    </script>
  </body>
</html>
