<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ProseMirror</title>
    <link rel="stylesheet" href="./prosemirror-editor.css">
    <script src="/extension-ready.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <div id="content"></div>


    <script type="module">
      import {EditorState, EditorView, Schema, DOMParser, schema, addListNodes} from '/vendor/prosemirror.js'

      const mySchema = new Schema({
        nodes: addListNodes(schema.spec.nodes, 'paragraph block*', 'block'),
        marks: schema.spec.marks
      })

      window.view = new EditorView(document.querySelector('#editor'), {
        state: EditorState.create({
          doc: DOMParser.fromSchema(mySchema).parse(document.querySelector('#content')),
        })
      })

      window.view.dom.setAttribute('role', 'textbox')
    </script>
  </body>
</html>
