<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Briskine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      html,
      body,
      #sidepanel,
      #sidepanel .briskine-dialog {
        height: 100%;
      }

      #sidepanel .dialog-search {
        padding: 3px;
      }

      #sidepanel .dialog-search input {
        border-radius: var(--radius-small);
        border: 2px solid transparent;
      }

      #sidepanel .dialog-search input:focus {
        border-color: var(--primary-color);
      }
    </style>
  </head>
  <body>
    <div id="sidepanel"></div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
